[project]
name = "nock"
version = "0.2.0"
description = "A toolbox your coding agents build for themselves: an agent-friendly CLI framework, telemetry of every call and session, and reflection rounds that turn it into better tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Gittik" }]
dependencies = []

[project.scripts]
nock = "nock.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.6", "basedpyright>=1.20"]

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nock"
module-root = "src"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "E501", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "standard"
